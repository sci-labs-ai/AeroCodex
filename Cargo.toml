[workspace]
resolver = "2"
members = [
    "crates/aero-codex-core",
    "crates/aero-codex-constants",
    "crates/aero-codex-atmosphere",
    "crates/aero-codex-thermo",
    "crates/aero-codex-gas-dynamics",
    "crates/aero-codex-aerodynamics",
    "crates/aero-codex-propulsion",
    "crates/aero-codex-heat-transfer",
    "crates/aero-codex-structures",
    "crates/aero-codex-flight-dynamics",
    "crates/aero-codex-astrodynamics",
    "crates/aero-codex-life-support",
    "crates/aero-codex-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sci-labs-ai/AeroCodex"
readme = "README.md"
rust-version = "1.74"
description = "Source-traceable aerospace research software in pure Rust"
homepage = "https://sci-labs-ai.github.io/AeroCodex/"
documentation = "https://sci-labs-ai.github.io/AeroCodex/api/"
keywords = ["aerospace", "astrodynamics", "engineering", "research"]
categories = ["science", "mathematics"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"

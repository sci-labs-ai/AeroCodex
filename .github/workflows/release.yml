name: Release artifacts

on:
  push:
    tags:
      - "v0.1.0-alpha.1*"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Exact governed release tag.
        required: true
        type: string
      release_commit:
        description: Exact governed commit object to package.
        required: true
        type: string
      publish_release:
        description: Publish the governed final release after every artifact gate passes.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  AEROCODEX_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  AEROCODEX_RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
  AEROCODEX_PUBLISH_RELEASE: ${{ inputs.publish_release || false }}

jobs:
  validate:
    name: Validate governed release request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.AEROCODEX_RELEASE_COMMIT }}
      - name: Validate tag and commit identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${AEROCODEX_RELEASE_TAG}" =~ ^v0\.1\.0-alpha\.1(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "unsupported release tag: ${AEROCODEX_RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${AEROCODEX_PUBLISH_RELEASE}" == "true" && "${AEROCODEX_RELEASE_TAG}" != "v0.1.0-alpha.1" ]]; then
            echo "only the governed final tag may be published" >&2
            exit 1
          fi
          resolved="$(git rev-parse 'HEAD^{commit}')"
          if [[ "${resolved}" != "${AEROCODEX_RELEASE_COMMIT}" ]]; then
            echo "release commit mismatch: expected ${AEROCODEX_RELEASE_COMMIT}, resolved ${resolved}" >&2
            exit 1
          fi

  build:
    name: Build and smoke-test (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: aerocodex-0.1.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz
            executable: aerocodex
            shell_kind: unix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: aerocodex-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip
            executable: aerocodex.exe
            shell_kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: aerocodex-0.1.0-alpha.1-x86_64-apple-darwin.tar.gz
            executable: aerocodex
            shell_kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            archive: aerocodex-0.1.0-alpha.1-aarch64-apple-darwin.tar.gz
            executable: aerocodex
            shell_kind: unix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.AEROCODEX_RELEASE_COMMIT }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Verify release source
        run: cargo run --locked -p xtask -- verify-release-identity
      - name: Build locked release binary
        env:
          AEROCODEX_BUILD_COMMIT: ${{ env.AEROCODEX_RELEASE_COMMIT }}
        run: cargo build --locked --release -p aero-codex-cli --target ${{ matrix.target }}
      - name: Stage, smoke-test, and archive (Unix)
        if: matrix.shell_kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          bundle="aerocodex-0.1.0-alpha.1-${{ matrix.target }}"
          mkdir -p "dist/${bundle}/release"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${bundle}/"
          cp README.md LICENSE LICENSE-APACHE LICENSE-MIT NOTICE "dist/${bundle}/"
          cp release/release-manifest.toml release/release-manifest.sha256 "dist/${bundle}/release/"
          binary="dist/${bundle}/${{ matrix.executable }}"
          "$binary" version --json > "dist/${bundle}/version.json"
          "$binary" formula list --executable --json > "dist/${bundle}/formula-list.json"
          "$binary" formula run m00.angle.deg_to_rad --degrees 180 --json > "dist/${bundle}/formula-run.json"
          "$binary" self-check --json > "dist/${bundle}/self-check.json"
          python3 - "$binary" <<'PY'
          import json, pathlib, subprocess, sys
          bundle = pathlib.Path(sys.argv[1]).parent
          version = json.loads((bundle / "version.json").read_text())
          formulas = json.loads((bundle / "formula-list.json").read_text())
          self_check = json.loads((bundle / "self-check.json").read_text())
          expected = (bundle / "release" / "release-manifest.sha256").read_text().split()[0]
          assert version["package_version"] == "0.1.0-alpha.1"
          assert version["release_manifest_sha256"] == expected
          assert version["build_profile"] == "release"
          assert len(formulas["formulas"]) == 12
          assert self_check["passed"] == 14 and self_check["failed"] == 0
          PY
          tar -C dist -czf "dist/${{ matrix.archive }}" "$bundle"
      - name: Stage, smoke-test, and archive (Windows)
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "aerocodex-0.1.0-alpha.1-${{ matrix.target }}"
          $bundlePath = Join-Path dist $bundle
          $releasePath = Join-Path $bundlePath release
          New-Item -ItemType Directory -Force -Path $releasePath | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" $bundlePath
          Copy-Item README.md, LICENSE, LICENSE-APACHE, LICENSE-MIT, NOTICE $bundlePath
          Copy-Item release/release-manifest.toml, release/release-manifest.sha256 $releasePath
          $binary = Join-Path $bundlePath "${{ matrix.executable }}"
          (& $binary version --json | Out-String) | Set-Content -Encoding utf8 (Join-Path $bundlePath version.json)
          if ($LASTEXITCODE -ne 0) { throw "version smoke test failed" }
          (& $binary formula list --executable --json | Out-String) | Set-Content -Encoding utf8 (Join-Path $bundlePath formula-list.json)
          if ($LASTEXITCODE -ne 0) { throw "formula list smoke test failed" }
          (& $binary formula run m00.angle.deg_to_rad --degrees 180 --json | Out-String) | Set-Content -Encoding utf8 (Join-Path $bundlePath formula-run.json)
          if ($LASTEXITCODE -ne 0) { throw "formula run smoke test failed" }
          (& $binary self-check --json | Out-String) | Set-Content -Encoding utf8 (Join-Path $bundlePath self-check.json)
          if ($LASTEXITCODE -ne 0) { throw "self-check smoke test failed" }
          $version = Get-Content -Raw (Join-Path $bundlePath version.json) | ConvertFrom-Json
          $formulas = Get-Content -Raw (Join-Path $bundlePath formula-list.json) | ConvertFrom-Json
          $selfCheck = Get-Content -Raw (Join-Path $bundlePath self-check.json) | ConvertFrom-Json
          $expected = ((Get-Content -Raw (Join-Path $releasePath release-manifest.sha256)) -split '\s+')[0]
          if ($version.package_version -ne "0.1.0-alpha.1" -or $version.release_manifest_sha256 -ne $expected -or $version.build_profile -ne "release") { throw "version identity mismatch" }
          if ($formulas.formulas.Count -ne 12) { throw "executable formula count mismatch" }
          if ($selfCheck.passed -ne 14 -or $selfCheck.failed -ne 0) { throw "self-check count mismatch" }
          Compress-Archive -Path $bundlePath -DestinationPath "dist/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  assemble:
    name: Assemble, hash, and attest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.AEROCODEX_RELEASE_COMMIT }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build source archive and release metadata
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=aerocodex-0.1.0-alpha.1-source/ --output=dist/aerocodex-0.1.0-alpha.1-source.tar.gz "${AEROCODEX_RELEASE_COMMIT}"
          cp release/release-manifest.toml dist/aerocodex-0.1.0-alpha.1-release-manifest.toml
          epoch="$(git show -s --format=%ct "${AEROCODEX_RELEASE_COMMIT}")"
          python3 scripts/release/generate_spdx_sbom.py --dist dist --commit "${AEROCODEX_RELEASE_COMMIT}" --epoch "$epoch" --output dist/aerocodex-0.1.0-alpha.1.spdx.json
          python3 scripts/release/generate_provenance.py --dist dist --commit "${AEROCODEX_RELEASE_COMMIT}" --tag "${AEROCODEX_RELEASE_TAG}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" --output dist/aerocodex-0.1.0-alpha.1.intoto.jsonl
          find dist -maxdepth 1 -type f ! -name 'aerocodex-0.1.0-alpha.1-SHA256SUMS' -printf '%f\n' | LC_ALL=C sort | while read -r file; do
            sha256sum "dist/${file}"
          done | sed 's#  dist/#  #' > dist/aerocodex-0.1.0-alpha.1-SHA256SUMS
          (cd dist && sha256sum -c aerocodex-0.1.0-alpha.1-SHA256SUMS)
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/aerocodex-0.1.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz
            dist/aerocodex-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip
            dist/aerocodex-0.1.0-alpha.1-x86_64-apple-darwin.tar.gz
            dist/aerocodex-0.1.0-alpha.1-aarch64-apple-darwin.tar.gz
            dist/aerocodex-0.1.0-alpha.1-source.tar.gz
            dist/aerocodex-0.1.0-alpha.1-release-manifest.toml
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/aerocodex-0.1.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz
            dist/aerocodex-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip
            dist/aerocodex-0.1.0-alpha.1-x86_64-apple-darwin.tar.gz
            dist/aerocodex-0.1.0-alpha.1-aarch64-apple-darwin.tar.gz
            dist/aerocodex-0.1.0-alpha.1-source.tar.gz
            dist/aerocodex-0.1.0-alpha.1-release-manifest.toml
          sbom-path: dist/aerocodex-0.1.0-alpha.1.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: aerocodex-release-bundle
          path: dist/*
          if-no-files-found: error

  validate-artifacts:
    name: Downloaded friend test (${{ matrix.target }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: aerocodex-0.1.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz
            executable: aerocodex
            shell_kind: unix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: aerocodex-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip
            executable: aerocodex.exe
            shell_kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: aerocodex-0.1.0-alpha.1-x86_64-apple-darwin.tar.gz
            executable: aerocodex
            shell_kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            archive: aerocodex-0.1.0-alpha.1-aarch64-apple-darwin.tar.gz
            executable: aerocodex
            shell_kind: unix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aerocodex-release-bundle
          path: download
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Extract and run downloaded friend package (Unix)
        if: matrix.shell_kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          (cd download && sha256sum -c aerocodex-0.1.0-alpha.1-SHA256SUMS)
          mkdir extracted
          tar -C extracted -xzf "download/aerocodex-0.1.0-alpha.1-source.tar.gz"
          tar -C extracted -xzf "download/${{ matrix.archive }}"
          source_dir="${PWD}/extracted/aerocodex-0.1.0-alpha.1-source"
          binary="${PWD}/extracted/aerocodex-0.1.0-alpha.1-${{ matrix.target }}/${{ matrix.executable }}"
          chmod +x "$binary"
          cd "$source_dir"
          AEROCODEX_FRIEND_BINARY="$binary" \
            AEROCODEX_EXPECTED_COMMIT="${AEROCODEX_RELEASE_COMMIT}" \
            scripts/friend_test_local.sh
      - name: Extract and run downloaded friend package (Windows)
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $checksumFile = Join-Path $PWD "download/aerocodex-0.1.0-alpha.1-SHA256SUMS"
          foreach ($line in Get-Content $checksumFile) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "malformed release checksum: $line" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $PWD "download/$($Matches[2])")).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "release checksum mismatch: $($Matches[2])" }
          }
          New-Item -ItemType Directory -Force extracted | Out-Null
          tar -C extracted -xzf "download/aerocodex-0.1.0-alpha.1-source.tar.gz"
          Expand-Archive "download/${{ matrix.archive }}" -DestinationPath extracted
          $sourceDir = Join-Path $PWD "extracted/aerocodex-0.1.0-alpha.1-source"
          $env:AEROCODEX_FRIEND_BINARY = Join-Path $PWD "extracted/aerocodex-0.1.0-alpha.1-${{ matrix.target }}/${{ matrix.executable }}"
          $env:AEROCODEX_EXPECTED_COMMIT = $env:AEROCODEX_RELEASE_COMMIT
          Set-Location $sourceDir
          & .\scripts\friend_test_local.ps1

  verify-metadata:
    name: Verify downloaded release metadata
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AEROCODEX_RELEASE_COMMIT }}
      - uses: actions/download-artifact@v8
        with:
          name: aerocodex-release-bundle
          path: download
      - name: Verify checksums, manifest, SBOM, and provenance
        shell: bash
        run: |
          set -euo pipefail
          (cd download && sha256sum -c aerocodex-0.1.0-alpha.1-SHA256SUMS)
          expected_manifest="$(cut -d' ' -f1 release/release-manifest.sha256)"
          actual_manifest="$(sha256sum download/aerocodex-0.1.0-alpha.1-release-manifest.toml | cut -d' ' -f1)"
          test "$actual_manifest" = "$expected_manifest"
          python3 - "$AEROCODEX_RELEASE_COMMIT" "$AEROCODEX_RELEASE_TAG" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("download")
          commit = sys.argv[1]
          tag = sys.argv[2]
          spdx = json.loads((root / "aerocodex-0.1.0-alpha.1.spdx.json").read_text())
          provenance = json.loads((root / "aerocodex-0.1.0-alpha.1.intoto.jsonl").read_text())
          assert spdx["spdxVersion"] == "SPDX-2.3"
          assert len(spdx["packages"]) == 1
          package_id = spdx["packages"][0]["SPDXID"]
          describes = [
              item for item in spdx["relationships"]
              if item == {
                  "spdxElementId": "SPDXRef-DOCUMENT",
                  "relationshipType": "DESCRIBES",
                  "relatedSpdxElement": package_id,
              }
          ]
          assert len(describes) == 1
          assert provenance["_type"] == "https://in-toto.io/Statement/v1"
          definition = provenance["predicate"]["buildDefinition"]
          assert definition["externalParameters"]["ref"] == f"refs/tags/{tag}"
          assert definition["resolvedDependencies"][0]["digest"]["gitCommit"] == commit
          subjects = {item["name"]: item["digest"]["sha256"] for item in provenance["subject"]}
          expected_subjects = {
              "aerocodex-0.1.0-alpha.1-aarch64-apple-darwin.tar.gz",
              "aerocodex-0.1.0-alpha.1-release-manifest.toml",
              "aerocodex-0.1.0-alpha.1-source.tar.gz",
              "aerocodex-0.1.0-alpha.1-x86_64-apple-darwin.tar.gz",
              "aerocodex-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip",
              "aerocodex-0.1.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz",
          }
          assert set(subjects) == expected_subjects
          for name, digest in subjects.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          spdx_files = {}
          spdx_sha1s = []
          for item in spdx["files"]:
              checksums = {entry["algorithm"]: entry["checksumValue"] for entry in item["checksums"]}
              spdx_files[item["fileName"]] = checksums["SHA256"]
              spdx_sha1s.append(checksums["SHA1"])
          assert set(spdx_files) == expected_subjects
          for name, digest in spdx_files.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          verification_code = hashlib.sha1("".join(sorted(spdx_sha1s)).encode("ascii")).hexdigest()
          assert spdx["packages"][0]["packageVerificationCode"]["packageVerificationCodeValue"] == verification_code
          PY

  draft:
    name: Create or publish governed release
    needs: [validate-artifacts, verify-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AEROCODEX_RELEASE_COMMIT }}
      - uses: actions/download-artifact@v8
        with:
          name: aerocodex-release-bundle
          path: dist
      - name: Create, refresh, or publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${AEROCODEX_RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "${AEROCODEX_PUBLISH_RELEASE}" != "true" && "$is_draft" != "true" ]]; then
              echo "candidate release ${tag} is already public; refusing to mutate it" >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --verify-tag --title "AeroCodex ${tag}" --notes-file docs/release/v0.1.0-alpha.1-release-notes.md
          fi
          if [[ "${AEROCODEX_PUBLISH_RELEASE}" == "true" ]]; then
            gh release edit "$tag" --draft=false --verify-tag --title "AeroCodex ${tag}" --notes-file docs/release/v0.1.0-alpha.1-release-notes.md
            expected_draft=false
          else
            expected_draft=true
          fi
          actual_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
          if [[ "$actual_draft" != "$expected_draft" ]]; then
            echo "release draft state mismatch: expected ${expected_draft}, found ${actual_draft}" >&2
            exit 1
          fi

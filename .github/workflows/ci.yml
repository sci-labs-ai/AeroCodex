name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Rust, release-manifest, and repository-integrity gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo check --workspace --all-targets --all-features
        run: cargo check --workspace --all-targets --all-features
      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --all
        run: cargo test --workspace --all-features
      - name: cargo doc --no-deps
        run: cargo doc --workspace --all-features --no-deps
      - name: cargo run -p xtask -- verify --all
        run: cargo run -p xtask -- verify --all
      - name: release manifest consistency check
        run: cargo run -p xtask -- verify-release-manifest
      - name: repository checksum gate
        run: cargo run -p xtask -- verify-checksums
      - name: equation-batch plan JSON check
        run: |
          cargo run -p xtask -- equation-batch plan --all-manifests --json > /tmp/equation_batch_plan.json
          python3 -m json.tool /tmp/equation_batch_plan.json >/dev/null
      - name: generated-artifact drift check
        run: cargo run -p xtask -- verify-generated
      - name: Run dependency policy
        run: cargo run -p xtask -- dependency-policy
      - name: Run Beta 1 CLI self-check
        run: cargo run -p aero-codex-cli -- self-check --json

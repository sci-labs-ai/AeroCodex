name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-identity:
    name: Release identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Workspace check
        run: cargo check --workspace
      - name: All-targets and all-features check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Repository checksums
        run: cargo run -p xtask -- verify-checksums
      - name: Release manifest
        run: cargo run -p xtask -- verify-release-manifest
      - name: Release identity
        run: cargo run -p xtask -- verify-release-identity
      - name: Generated artifacts
        run: cargo run -p xtask -- verify-generated
      - name: Aggregate verification
        run: cargo run -p xtask -- verify --all
      - name: Dependency policy
        run: cargo run -p xtask -- dependency-policy
      - name: Standard CLI version
        run: cargo run -p aero-codex-cli -- --version
      - name: Structured CLI identity
        run: cargo run -p aero-codex-cli -- version --json
      - name: Formula counts
        run: cargo run -p aero-codex-cli -- formula status-report --json
      - name: CLI self-check
        run: cargo run -p aero-codex-cli -- self-check --json

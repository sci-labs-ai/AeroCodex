name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-identity:
    name: Release identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AEROCODEX_RELEASE_IDENTITY_REVISION: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || (github.event_name == 'push' && github.sha) }}
      AEROCODEX_RELEASE_IDENTITY_BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Temporary release-slice generated-state probe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/aerocodex-promotion-probe/generated/rust
          cargo run -p xtask -- equation-batch report --all-manifests --out generated/equation_batch_status_report.json
          cargo run -p xtask -- formula-registry generate --out generated/formula_registry.json
          cargo run -p xtask -- formula-registry generate-rust --out generated/rust/formula_registry.rs
          cp generated/formula_registry.json /tmp/aerocodex-promotion-probe/generated/formula_registry.json
          cp generated/formula_registry.sha256 /tmp/aerocodex-promotion-probe/generated/formula_registry.sha256
          cp generated/rust/formula_registry.rs /tmp/aerocodex-promotion-probe/generated/rust/formula_registry.rs
          cp generated/equation_batch_status_report.json /tmp/aerocodex-promotion-probe/generated/equation_batch_status_report.json
          cargo build -p aero-codex-cli
          target/debug/aerocodex formula run m00.angle.deg_to_rad --degrees 180 --json > /tmp/aerocodex-promotion-probe/formula-run-success.json
          if target/debug/aerocodex formula run aerodynamics.coefficients.drag_coefficient --json 2> /tmp/aerocodex-promotion-probe/formula-run-error.json; then
            echo "blocked non-release formula unexpectedly executed" >&2
            exit 1
          else
            test "$?" -eq 4
          fi
          cargo fmt --all
          mkdir -p /tmp/aerocodex-promotion-probe/formatted/crates/aero-codex-cli/src
          mkdir -p /tmp/aerocodex-promotion-probe/formatted/crates/aero-codex-cli/tests
          mkdir -p /tmp/aerocodex-promotion-probe/formatted/xtask/src
          cp crates/aero-codex-cli/src/main.rs /tmp/aerocodex-promotion-probe/formatted/crates/aero-codex-cli/src/main.rs
          cp crates/aero-codex-cli/tests/cli.rs /tmp/aerocodex-promotion-probe/formatted/crates/aero-codex-cli/tests/cli.rs
          cp xtask/src/release_identity.rs /tmp/aerocodex-promotion-probe/formatted/xtask/src/release_identity.rs
          cp xtask/src/release_manifest.rs /tmp/aerocodex-promotion-probe/formatted/xtask/src/release_manifest.rs
      - name: Upload temporary release-slice generated-state probe
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-slice-generated-state-probe
          path: /tmp/aerocodex-promotion-probe
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Workspace check
        run: cargo check --workspace
      - name: All-targets and all-features check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Release-slice equation verification
        run: cargo test -p aero-codex-astrodynamics --test release_slice_validation
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Repository checksums
        run: cargo run -p xtask -- verify-checksums
      - name: Release manifest
        run: cargo run -p xtask -- verify-release-manifest
      - name: Release identity
        run: cargo run -p xtask -- verify-release-identity
      - name: Generated artifacts
        run: cargo run -p xtask -- verify-generated
      - name: Aggregate verification
        run: cargo run -p xtask -- verify --all
      - name: Dependency policy
        run: cargo run -p xtask -- dependency-policy
      - name: Standard CLI version
        run: cargo run -p aero-codex-cli -- --version
      - name: Structured CLI identity
        run: cargo run -p aero-codex-cli -- version --json
      - name: Formula counts
        run: cargo run -p aero-codex-cli -- formula status-report --json
      - name: CLI self-check
        run: cargo run -p aero-codex-cli -- self-check --json
